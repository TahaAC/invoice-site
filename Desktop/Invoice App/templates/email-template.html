<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Invoice/Quotation</title>
    <style>
        @page {
            size: A4;
            margin: 20mm;
        }
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 20px;
            background: #fff;
        }
        .document-container {
            max-width: 210mm;
            margin: 0 auto;
            padding: 20px;
            background: #fff;
        }
        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #1a3a5f;
        }
        .company-logo {
            max-width: 200px;
            height: auto;
        }
        .company-info {
            text-align: right;
            font-size: 0.9em;
        }
        .document-title {
            text-align: center;
            color: #1a3a5f;
            font-size: 24px;
            margin: 20px 0;
        }
        .document-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 5px;
        }
        .client-details, .job-details {
            flex: 1;
            margin: 10px;
        }
        .section-title {
            color: #1a3a5f;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }
        .detail-row {
            margin-bottom: 8px;
        }
        .label {
            font-weight: bold;
            color: #555;
        }
        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        .items-table th {
            background: #1a3a5f;
            color: white;
            padding: 10px;
            text-align: left;
        }
        .items-table td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        .items-table tr:nth-child(even) {
            background: #f8f9fa;
        }
        .amounts-section {
            margin-left: auto;
            width: 300px;
            margin-top: 20px;
        }
        .amount-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
        }
        .amount-row.total {
            font-weight: bold;
            font-size: 1.2em;
            border-bottom: double 3px #1a3a5f;
            color: #1a3a5f;
        }
        .payment-details {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid #1a3a5f;
            text-align: center;
            font-size: 0.9em;
            color: #666;
        }
        .terms-conditions {
            margin-top: 30px;
            font-size: 0.9em;
            color: #666;
        }
        @media print {
            body {
                padding: 0;
                background: #fff;
            }
            .document-container {
                padding: 0;
            }
            .no-print {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Content will be dynamically inserted here -->
</body>
</html>
