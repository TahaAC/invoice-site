<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        @page {
            size: A4;
            margin: 20mm;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            color: #333;
            font-size: 10pt;
        }
        .invoice-container {
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
        }
        .company-logo {
            max-width: 200px;
            max-height: 100px;
        }
        .company-info {
            text-align: right;
        }
        .document-title {
            font-size: 24pt;
            color: #1a3a5f;
            margin-bottom: 20px;
            text-align: center;
        }
        .info-section {
            margin-bottom: 30px;
        }
        .info-section h3 {
            color: #1a3a5f;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f8f9fa;
            color: #1a3a5f;
        }
        .amount-column {
            text-align: right;
        }
        .totals {
            margin-left: auto;
            width: 300px;
        }
        .total-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #ddd;
        }
        .total-row:last-child {
            font-weight: bold;
            border-bottom: double 3px #ddd;
        }
        .payment-details {
            margin-top: 40px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 5px;
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 9pt;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="invoice-container">
        <!-- Content will be dynamically inserted here -->
    </div>
</body>
</html>
